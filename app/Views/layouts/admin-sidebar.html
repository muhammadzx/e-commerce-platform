<script>
(() => {
  const sidebar = document.querySelector('.admin-sidebar');
  if (!sidebar) return;

  const toggle = sidebar.querySelector('.admin-menu-toggle');
  const navigation = sidebar.querySelector('#admin-navigation');
  if (!toggle || !navigation) return;

  const closeMenu = () => {
    sidebar.classList.remove('is-open');
    toggle.setAttribute('aria-expanded', 'false');
  };

  toggle.addEventListener('click', () => {
    const isOpen = sidebar.classList.toggle('is-open');
    toggle.setAttribute('aria-expanded', String(isOpen));
  });

  const links = [...navigation.querySelectorAll('nav a')];
  const currentPath = window.location.pathname.replace(/\/+$/, '');

  let currentLink = links.find((link) => {
    try {
      return new URL(link.href, window.location.href).pathname.replace(/\/+$/, '') === currentPath;
    } catch (_) {
      return false;
    }
  });

  if (!currentLink) {
    const pageClasses = [
      ['admin-reports', 'ai-reports-link'],
      ['admin-products', 'products-link'],
      ['admin-categories', 'categories-link'],
      ['admin-customers', 'customers-link'],
      ['admin-orders', 'orders-link'],
      ['admin-reviews', 'reviews-link'],
      ['admin-profile', 'profile-link'],
      ['admin-overview', 'overview-link']
    ];

    const match = pageClasses.find(([pageClass]) =>
      document.body.classList.contains(pageClass)
    );

    if (match) {
      currentLink = navigation.querySelector(`.${match[1]}`);
    }
  }

  links.forEach((link) => {
    const isCurrent = link === currentLink;

    link.classList.toggle('active', isCurrent);

    if (isCurrent) {
      link.setAttribute('aria-current', 'page');
    } else {
      link.removeAttribute('aria-current');
    }

    link.addEventListener('click', closeMenu);
  });

  const profileLink = sidebar.querySelector('.profile-link');

  if (profileLink) {
    const isProfile =
      document.body.classList.contains('admin-profile') ||
      new URL(profileLink.href, window.location.href).pathname.replace(/\/+$/, '') === currentPath;

    profileLink.classList.toggle('active', isProfile);

    if (isProfile) {
      profileLink.setAttribute('aria-current', 'page');
    } else {
      profileLink.removeAttribute('aria-current');
    }
  }

  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') closeMenu();
  });

  document.addEventListener('click', (event) => {
    if (!sidebar.contains(event.target)) closeMenu();
  });
})();
</script>
